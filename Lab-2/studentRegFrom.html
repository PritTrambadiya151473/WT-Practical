<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>

<body>

    <h1>Student Registration Form</h1>

    <form>

        <fieldset>

            <legend>Perdonal Information</legend>

            <label>Full Name :</label>
            <input type="text" name="fullname" required minlength="3" maxlength="50">
            <br><br>

            <label>Email :</label>
            <input type="email" name="email" required>
            <br><br>

            <label>Password :</label>
            <input type="password"
                   name="password"
                   required
                   minlength="8"
                   pattern="(?=.*\d)(?=.*[a-zA-Z]).{8,}"
                   title="Password must be at least 8 characters and include letters and numbers">
            <br><br>

            <label>Phone Number :</label>
            <input type="tel"
                   name="phone"
                   required
                   pattern="[0-9]{10}"
                   title="Enter a 10 digit phone number">
            <br><br>

            <label>Age :</label>
            <input type="number"
                   name="age"
                   required
                   min="16"
                   max="60">
            <br><br>

            <label>Gender :</label>
            <input type="radio" name="gender" value="Male" required> Male
            <input type="radio" name="gender" value="Female" required> Female
            <br><br>

        </fieldset>

        <fieldset>

            <legend>Prefrence adn Extras</legend>

            <label>Upload Profile Picture :</label>
            <input type="file" name="profile_pic" accept="image/*" required>
            <br><br>

            <label>Color :</label>
            <input type="color" name="color" required>
            <br><br>

            <label>Search For Course :</label>
            <input type="search" name="course_search" required>
            <br><br>

            <label>Course Interest Range :</label>
            <input type="range" name="course_interest" min="0" max="100" required>
            <br><br>

            <label>Personal Website :</label>
            <input type="url"
                   name="website"
                   required
                   pattern="https://.*"
                   title="URL must start with https://">
            <br><br>

            <label>Course Type :</label>
            <select name="course_type" required>
                <option value="">Select</option>
                <option value="CE">CE</option>
                <option value="EE">EE</option>
                <option value="ME">ME</option>
                <option value="CIV">CIV</option>
            </select>

            <br><br>

            <label>Course Type (2) :</label>

            <select name="course_type_2" required>
                <optgroup label="Engineering">
                    <option value="CE">CE</option>
                    <option value="EE">EE</option>
                    <option value="ME">ME</option>
                    <option value="CIV">CIV</option>
                </optgroup>
            </select>

            <br><br>

            <label>Preferred Country :</label>

            <input list="countries" name="country" required>

            <datalist id="countries">
                <option>USA</option>
                <option>UK</option>
                <option>INDIA</option>
                <option>JAPAN</option>
            </datalist>

            <br><br>

            <label>Agree To Terms :</label>
            <input type="checkbox" name="agree" required> I Agree

            <br><br>

        </fieldset>

        <fieldset>

            <legend>Date & Time Info</legend>

            <label>Date :</label>
            <input type="date" name="dob" required>
            <br><br>

            <label>Select Time :</label>
            <input type="time" name="time" required>
            <br><br>

            <label>Select Month :</label>
            <input type="month" name="month" required>
            <br><br>

            <label>Select Week :</label>
            <input type="week" name="week" required>
            <br><br>

            <label>Select Date & Time :</label>
            <input type="datetime-local" name="datetime" required>

        </fieldset>

        <fieldset>

            <legend>Form Controls</legend>

            <button type="submit">Click Me</button>

            <br><br>

            <input type="image" src="" alt="MU LOGO">

            <br><br>

            <input type="reset">

        </fieldset>

    </form>

</body>

</html>
